name: Probe concurrent first sessions

# Checks that sessions set up together at the start of a process do not panic
# in wazero (see compileColorer and probe_first_sessions_test.go). Before the
# fix, the configuration below panicked in 7 of 88 processes on windows-latest.
# Run it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Processes per runner
        default: "150"

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-latest, ubuntu-24.04-arm, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the test binary
        shell: bash
        run: go test -c -o probe.test .
      - name: Warm the file cache
        shell: bash
        env:
          COLORER4GO_PROBE: "1"
          COLORER4GO_PROBE_WORKERS: "1"
        run: ./probe.test -test.run '^TestProbeFirstSessions$' -test.v
      - name: Run the probe
        shell: bash
        env:
          COLORER4GO_PROBE: "1"
          RUNS: ${{ inputs.runs }}
        run: |
          set -u
          burn=$(( $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4) * 2 ))
          : > probe.log
          crashed=0
          for i in $(seq 1 "$RUNS"); do
            if ! COLORER4GO_PROBE_BURN=$burn COLORER4GO_PROBE_STEP=0s \
                 ./probe.test -test.run '^TestProbeFirstSessions$' >> probe.log 2>&1; then
              crashed=$((crashed + 1))
              echo "PROBE-CRASH run=$i" >> probe.log
            fi
          done
          panicked=$(grep '^PROBE-RESULT' probe.log | grep -vc 'panics=0' || true)
          echo "burn=$burn runs=$RUNS crashed-processes=$crashed panicked-processes=$panicked"
          grep -m1 -A40 'PROBE-FIRST-PANIC' probe.log || true
          if [ "$crashed" -ne 0 ] || [ "$panicked" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: probe.log
